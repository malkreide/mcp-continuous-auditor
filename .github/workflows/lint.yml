name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ruff pinned so an upstream release cannot change the rule set or the
      # formatter and turn CI red on untouched code. Bump deliberately.
      #
      # NOTE: this version and the `rev` in .pre-commit-config.yaml must agree.
      # The last step of this job checks that.
      # `pyyaml` kommt dazu, seit Check 6 (die ausgelieferten Workflow-
      # Templates) in diesem Job laeuft statt in tests.yml. Ungepinnt wie
      # dort: Es wird zum Parsen benutzt, nicht zum Formatieren — ein
      # Upstream-Release verschiebt hier kein Urteil.
      - name: Install pinned Ruff
        run: pip install ruff==0.16.3 pyyaml

      # ONE COMMAND INSTEAD OF FIVE STEPS.
      #
      # The gates of this job are now numbered checks under `scripts/checks/`:
      # 1 pin sync, 2 the running Ruff, 3 `ruff check` over root and every
      # subproject, 4 the same for `ruff format --check`, 5 the width
      # stability of the portfolio scripts. The order lives in the number, not
      # in the order of `run:` lines — a lint finding produced by an unpinned
      # Ruff is worthless.
      #
      # And one run names ALL findings. Before, the first red step aborted the
      # job and the rest never ran: every failure cost a round.
      #
      # The pre-commit hook still calls `scripts/check_ruff_pin.py` directly —
      # the pure comparison logic stayed there, `scripts/checks/` only hangs it
      # in. One implementation, two entry points.
      - name: All gates (scripts/checks)
        env:
          PYTHONUTF8: "1"
        run: bash scripts/validate.sh
