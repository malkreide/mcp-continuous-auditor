# The auditor's own test suite.
#
# This repository ships CI as `.yml.template` files — but those are for the
# TARGET server repo. Until now nothing ran the auditor's own test suite, so a
# regression in live_probe.py, the budget guard or the Broker pipeline would
# have reached main unchallenged. A tool that holds others to test discipline
# and has none itself is the more embarrassing of the two failures.
#
# stdlib `unittest` only. The optional dependencies installed below do not make
# the suite run — they make three test classes stop skipping. See the gate.

name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is stdlib-only by design; these three gate test classes that
      # would otherwise skip. Installing them here is the point of this job:
      # a skipped test is indistinguishable from a passing one in a summary.
      #   pyyaml  → tests/test_promptfoo_profiles.py
      #   fastmcp → tests/test_smoke_target.py (drives its own smoke_server fixture)
      #   httpx   → tests/fixtures/smoke_server.py
      #   ruff    → tests/test_format_gate.py (runs both gates against fixtures)
      #
      # The Ruff version here is held to the one in lint.yml and
      # .pre-commit-config.yaml by scripts/check_ruff_pin.py. It has to be: the
      # gate this pins is the one whose whole point is that a formatter change
      # reformats untouched code, and a third pin free to move would demonstrate
      # that on this repo rather than prevent it.
      - name: Install the optional test dependencies
        run: python -m pip install --quiet pyyaml fastmcp httpx ruff==0.16.1

      - name: Unit tests, with no dependency-driven skips tolerated
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import sys, unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2, stream=sys.stdout).run(suite)

          for test, reason in result.skipped:
              print(f"SKIPPED: {test.id()} — {reason}")

          # A test skipped because a dependency is missing is a check that did
          # not run while looking exactly like one that passed. That is the same
          # failure mode live-probe.yml.template guards against for the canary,
          # and it is CI's job to prevent it here: install the dependency rather
          # than let the check quietly disappear. Environment-driven skips (no
          # bash, no git) stay allowed — they cannot occur on this runner.
          dep_skips = [t.id() for t, r in result.skipped if "not installed" in r]
          if dep_skips:
              print("::error title=Silent skip::"
                    f"{len(dep_skips)} test(s) skipped for a missing dependency: "
                    f"{', '.join(dep_skips)}. Install it in this workflow.")
              sys.exit(1)

          sys.exit(0 if result.wasSuccessful() else 1)
          PY


      # The auditor ships CI templates that impose gates on the repos it
      # audits. Nothing made anyone answer whether those gates also hold here —
      # and for `uv run ruff check` the answer was no, across 57 own Python
      # files, until #52. This step makes every shipped gate carry a written
      # answer, and goes red for one that does not.
      #
      # Rationale and the four hard rules: scripts/dogfood_gate.py.
      - name: The auditor answers for itself what it demands of others
        env:
          PYTHONUTF8: "1"
        run: python scripts/dogfood_gate.py

