# Ruff-Konfiguration.
#
# Kein `pyproject.toml` im Repo — der Auditor ist kein Python-Paket, sondern
# eine Sammlung aus Workflows, Templates und Skripten. Deshalb steht die
# Konfiguration in einer eigenen `ruff.toml`.
#
# Anlass: `.github/workflows/ci.yml.template` liefert seit je `uv run ruff
# check` an die auditierten Repos aus — auf den eigenen Code lief Ruff nie.
# Das ist dieselbe Klasse, aus der `OPS-005` (Pipeline-Ehrlichkeit) entstand,
# und deren Auslöser ausgerechnet dieses Repo war (#29: eine Testsuite, die
# kein Workflow ausführte).

# Die Test-Matrix in .github/workflows/tests.yml faehrt 3.11 und 3.13.
target-version = "py311"

# Markdown bleibt aussen vor — und zwar als bewusste Entscheidung, nicht als
# Versehen.
#
# Bis ruff 0.15.8 war die Formatierung von Python-Bloecken in Markdown
# `preview`-only: ein `ruff format --check .` liess `.md` unberuehrt und meldete
# «Markdown formatting is experimental, enable preview mode», sobald man eine
# solche Datei direkt uebergab. Seit 0.16.1 ist sie stabil und standardmaessig
# an. Der Sprung auf 0.16.1 haette dieses Gate damit ueber Nacht auf
# Dokumentation ausgeweitet, die niemand angefasst hat — genau der Effekt, gegen
# den der Pin ueberhaupt existiert.
#
# Gemessen beim Bump: kein einziges `.py` in diesem Repo formatiert sich unter
# 0.16.1 anders. Betroffen waren ausschliesslich vier `.md` (CHANGELOG und drei
# docs/probes/-Seiten), und portfolioweit dieselbe Lage — bei mcp-audit-skill 82
# Dateien. Das ist kein Argument gegen Markdown-Formatierung, sondern dagegen,
# sie als Nebenwirkung eines Versions-Bumps einzufuehren: sie umbricht
# Code-Beispiele in Prosa, und ob das erwuenscht ist, entscheidet man an den
# Beispielen, nicht am Pin.
#
# Sie zu uebernehmen ist deshalb eine eigene, messbare Aenderung: diese Zeile
# entfernen, `ruff format .` laufen lassen, Diff lesen.
#
# `extend-exclude`, nicht `exclude`: `exclude` ERSETZT ruffs Vorgabeliste, und
# damit waeren `.venv/`, `node_modules/` und Konsorten wieder im Gate.
# Gemessen: zwei Dateien unter `.venv/` und `node_modules/` werden mit
# `exclude` beanstandet, mit `extend-exclude` nicht.
extend-exclude = ["*.md"]

[lint]
# Expliziter Regelsatz, gleichgezogen mit dem uebrigen Portfolio. Ein `select`
# in der Konfiguration ersetzt die eingebauten Defaults vollstaendig; damit ist
# der erzwungene Satz exakt diese Liste, unabhaengig davon, ob eine spaetere
# ruff-Version ihre Defaults aendert.
#
#   E4 — pycodestyle: Importe (u.a. E402, Import nicht am Dateianfang)
#   E7 — pycodestyle: Anweisungen (Vergleiche, mehrere Statements pro Zeile)
#   E9 — pycodestyle: Syntax- und IO-Fehler
#   F  — Pyflakes (ungenutzte Importe und Variablen, f-String-Fehler, …)
#   I  — Import-Sortierung (isort)
#   UP — pyupgrade (moderne Syntax, z.B. `X | None`, collections.abc)
#   B  — flake8-bugbear
#   C4 — flake8-comprehensions
#   SIM— flake8-simplify
#   RUF— ruff-eigene Regeln
#
# E501 (Zeilenlaenge) bleibt bewusst aussen vor: das entscheidet der Formatter.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

ignore = [
    # Die Prosa nutzt bewusste Typografie — Halbgeviertstriche in Docstrings
    # und Kommentaren. Die Ambiguous-Unicode-Regeln melden die als
    # Verwechslungszeichen (17 Befunde), was hier kein Fehler ist.
    "RUF001",
    "RUF002",
    "RUF003",
    # RUF100 meldet `noqa`-Direktiven, deren Regel nicht aktiviert ist — hier
    # 51 Stueck, alle fuer Regelsaetze, die dieses `select` nicht enthaelt:
    # BLE001, S310, ANN001, N802, PLC0415, E731. Sie sind nicht ueberfluessig,
    # sondern dokumentieren Absicht, und zwar mit Begruendung:
    #
    #   except Exception as exc:  # noqa: BLE001 - surfaced as a targets error
    #   urlopen(req, ...)         # noqa: S310 (fixed manifest URLs)
    #
    # RUF100 zu aktivieren hiesse, 51 solcher Begruendungen zu loeschen — und
    # sie in dem Moment wieder zu brauchen, in dem der Regelsatz sich
    # verbreitert. Die Information ist mehr wert als die Aufraeumung.
    "RUF100",
]
