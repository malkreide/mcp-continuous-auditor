# promptfooconfig.determ.yaml — the KEY-LESS deterministic profile (Analysis T-C).
#
# This profile runs the tool-output CONTRACT + the deterministic injection
# negative-tests. Every assertion here is deterministic (is-json / javascript /
# contains / not-contains) and the only provider is the in-process FastMCP call
# (file://providers/call_tool.py) — so it needs **no model key at all**.
#
# WHY A SEPARATE PROFILE: the credential-free Worker microVM
# (deploy/microvm/worker-cloud-init.yaml.tmpl) holds no API keys by design. The
# monolithic config's llm-rubric grader + generative red-team need a key, so the
# Worker would hard-fail on them every night. The Worker therefore runs ONLY this
# profile (PROMPTFOO_PROFILE=determ); the llm-rubric + red-team layer lives in the
# graded profile (promptfooconfig.yaml), run in CI-with-secrets and by a keyed
# operator run — never on the credential-free Worker.
#
# A determ-only pass is NOT a full pass: nightly_audit_report.py stamps the run's
# profile so a green determ run is never read as "red-team clear".
description: "zurich-opendata-mcp — deterministic contract + schema-drift + injection + list-response spec (key-less)"

providers:
  # Calls the MCP tool/resource in-process via the FastMCP in-memory client.
  - id: file://providers/call_tool.py
    label: mcp-direct

tests:
  # ─── (1) is-json contract: schemas are the drift detector ──────────────────
  - description: "datastore_sql: valid query returns schema-conformant JSON"
    vars:
      tool: zurich_datastore_sql
      fixture: datastore_sql
      args: '{"resource_id": "FIXTURE", "sql": "SELECT * FROM \"x\" LIMIT 5"}'
    assert:
      - type: is-json
        value: file://../schemas/zurich_datastore_sql.json
      - type: javascript
        value: "JSON.parse(output).records.length <= 5"

  - description: "geo layer A (Stadtkreise): GeoJSON FeatureCollection is schema-conformant"
    vars:
      resource: "zurich://geo/stadtkreise"
      fixture: geo_layer_stadtkreise
    assert:
      - type: is-json
        value: file://../schemas/geojson_featurecollection.json
      - type: javascript
        value: "JSON.parse(output).type === 'FeatureCollection'"

  - description: "geo layer B (Quartiere): GeoJSON FeatureCollection is schema-conformant"
    vars:
      resource: "zurich://geo/quartiere"
      fixture: geo_layer_quartiere
    assert:
      - type: is-json
        value: file://../schemas/geojson_featurecollection.json
      - type: javascript
        value: "JSON.parse(output).features.every(f => f.type === 'Feature')"

  # The zurich_geo_features TOOL returns a Markdown summary, not GeoJSON
  # (audit 2026-06-27). Encode that as a contract so a future switch to raw
  # JSON shows up as a failed expectation, not a silent change.
  - description: "geo_features tool: Markdown summary, intentionally NOT raw GeoJSON"
    vars:
      tool: zurich_geo_features
      fixture: geo_layer_stadtkreise
      args: '{"layer_id": "stadtkreise"}'
    assert:
      - type: javascript
        value: |
          (() => { try { JSON.parse(output); return false; } catch { return true; } })()

  # ─── (2) injection negative-tests (deterministic — no grader needed) ────────
  - description: "datastore_sql: stacked-statement injection is rejected, payload not forwarded"
    vars:
      tool: zurich_datastore_sql
      # Rejected by _validate_select_only BEFORE any network call -> no fixture.
      args: '{"resource_id": "FIXTURE", "sql": "SELECT 1; DROP TABLE x;--"}'
    assert:
      - type: not-contains
        value: "DROP TABLE"
      - type: contains-any
        value: ["error", "Error", "abgelehnt", "not allowed", "rejected", "invalid"]

  - description: "datastore_sql: non-SELECT (DELETE) is rejected"
    vars:
      tool: zurich_datastore_sql
      args: '{"resource_id": "FIXTURE", "sql": "DELETE FROM \"x\""}'
    assert:
      - type: contains-any
        value: ["error", "Error", "abgelehnt", "not allowed", "rejected", "SELECT"]

  - description: "search_stadtratsbeschluesse: quote in query is escaped, no raw DROP forwarded"
    vars:
      tool: search_stadtratsbeschluesse
      fixture: strb_search
      args: '{"query": "x''; DROP TABLE y;--"}'
    assert:
      - type: not-contains
        value: "DROP TABLE y"

  # ─── (4) confabulation guards: the empty result ────────────────────────────
  # An empty result is where a server is most tempted to explain itself, and a
  # model most tempted to invent. termdat-mcp#11 is the worked example: the tool
  # description said "an empty result usually means the term is out of scope",
  # the model took that as licence and produced a confident, fabricated answer
  # for a term that was in the database throughout.
  #
  # These are REGRESSION guards, deliberately negative: they assert that a
  # zero-record response stays neutral. The complementary positive requirement —
  # an empty result should carry a concrete next step (a `hint` field) — is
  # mcp-audit check FID-003 and is graded in promptfooconfig.yaml rather than
  # asserted here, so adopting it stays a decision rather than a red pipeline.
  - description: "empty result: zero records is well-formed, not an error"
    vars:
      tool: zurich_datastore_sql
      fixture: datastore_sql_empty
      args: '{"resource_id": "FIXTURE", "sql": "SELECT * FROM \"x\" WHERE 1=0"}'
    assert:
      - type: is-json
        value: file://../schemas/zurich_datastore_sql.json
      - type: javascript
        value: "JSON.parse(output).records.length === 0"

  # ─── (5) spec 2026-07-28: list responses ───────────────────────────────────
  # WHAT THESE CAN AND CANNOT SAY. The stateless core is a WIRE property, and
  # this profile has no wire: the provider drives the FastMCP in-memory client
  # in-process, so an assert that "a call without initialize succeeds" would be
  # a statement about the SDK and would pass for every server, migrated or not.
  # That is the false-green this whole repository is written against, so the
  # handshake question lives in scripts/spec_probe.py --url instead, where it is
  # measured on a real connection.
  #
  # What IS honestly assertable here is the payload half of the same spec:
  # tools/list, prompts/list and resources/list MUST carry `ttlMs` and
  # `cacheScope` (a `CacheableResult`, changelog minor change 5) and SHOULD come
  # back in a deterministic order (minor change 3 — a SHOULD, not a MUST, which
  # is why the order assert below checks uniqueness rather than a fixed
  # sequence). Both are properties of the response object, which the in-memory
  # client hands over unchanged.
  #
  # BASELINE-GATED, on purpose. Whether the installed SDK surfaces `ttlMs` at all
  # is a fact about the SDK, and a red pipeline on an SDK that predates the field
  # would say nothing about the server. So determinism — which every SDK can
  # honour — is asserted hard, and the ttlMs/cacheScope pair is asserted as a
  # RECORDED OBSERVATION that fails only on the one shape that is definitely
  # wrong: a client that saw the fields and found them malformed. `raw_shape`
  # keeps "the server omitted it" apart from "this client cannot see it".
  - description: "tools/list: the order is deterministic across two calls"
    vars:
      list: tools
    assert:
      - type: is-json
      - type: javascript
        value: "Array.isArray(JSON.parse(output).names)"

  - description: "tools/list: names are unique and ordered, not a set in disguise"
    vars:
      list: tools
    assert:
      # Spec 2026-07-28 says servers SHOULD return tools in a deterministic
      # order. A duplicate name makes any order meaningless, and an empty
      # listing is not a passing listing — a server with no tools cannot have
      # been what the caller asked about.
      - type: javascript
        value: |
          (() => {
            const o = JSON.parse(output);
            if (!o.count) return false;
            return new Set(o.names).size === o.names.length;
          })()

  - description: "tools/list: ttlMs/cacheScope are observed, and a malformed pair fails"
    vars:
      list: tools
    assert:
      # NOT `ttlMs !== null`. An SDK that predates the field returns null, and
      # failing on that would report the client's age as the server's defect.
      # What must never pass is a value that is PRESENT and nonsense — a negative
      # or non-numeric ttl, or a cacheScope outside the vocabulary — because that
      # is the server getting the new spec wrong, which is the thing worth
      # catching. Tighten to a hard requirement once the portfolio baseline is on
      # an SDK that surfaces them; see docs/probes/spec.md.
      #
      # The vocabulary is `public` | `private` — read from the spec's changelog
      # (minor change 5), NOT guessed. An earlier version of this assert listed
      # `session|client|global|none`, which was invented: it would have FAILED
      # every compliant server and passed none, the precise inversion of what an
      # assert is for.
      - type: javascript
        value: |
          (() => {
            const o = JSON.parse(output);
            const ttlOk = o.ttlMs === null
              || (typeof o.ttlMs === 'number' && Number.isFinite(o.ttlMs) && o.ttlMs >= 0);
            const scopeOk = o.cacheScope === null
              || ['public', 'private'].includes(String(o.cacheScope));
            return ttlOk && scopeOk;
          })()

  - description: "resources/list: same contract, so a partial migration is visible"
    vars:
      list: resources
    assert:
      - type: is-json
      - type: javascript
        value: |
          (() => {
            const o = JSON.parse(output);
            return Array.isArray(o.names) && new Set(o.names).size === o.names.length;
          })()

  - description: "empty result: the server does not assert absence on the caller's behalf"
    vars:
      tool: zurich_datastore_sql
      fixture: datastore_sql_empty
      args: '{"resource_id": "FIXTURE", "sql": "SELECT * FROM \"x\" WHERE 1=0"}'
    assert:
      # Zero rows means "this query matched nothing", never "the data does not
      # exist" or "you are out of scope". A tool that draws the conclusion for
      # the model is the FID-003 anti-pattern; a tool that reports the fact is
      # not. Matching is case-insensitive on the serialised payload.
      - type: javascript
        value: |
          !/(usually means|likely means|does not exist|nicht vorhanden|nicht in der datenbank|out of scope|ausserhalb|nichts gefunden werden konnte)/i.test(output)
